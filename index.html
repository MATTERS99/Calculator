<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>

<body>
    <div class="main">
        <div class="disp">0</div>
        <div class="function">
            <div class="def">DEL</div>
            <div class="de">AC</div>
            <div class="per">%</div>
            <div class="divi">÷</div>
            <div class="sev">7</div>
            <div class="eig">8</div>
            <div class="nin">9</div>
            <div class="mul">×</div>
            <div class="fo">4</div>
            <div class="fiv">5</div>
            <div class="six">6</div>
            <div class="sub">−</div>
            <div class="one">1</div>
            <div class="two">2</div>
            <div class="th">3</div>
            <div class="plus">+</div>
            <div class="both">±</div>
            <div class="ze">0</div>
            <div class="dec">.</div>
            <div class="eq">=</div>
            <!-- <div class="one"></div> -->
        </div>
    </div>
</body>

</html>
