<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>

<body>
    <div class="main">
        <div class="disp">0</div>
        <div class="function">
            <div class="def">DEL</div>
            <div class="de">AC</div>
            <div class="per b">%</div>
            <div class="divi b">÷</div>
            <div class="sev a">7</div>
            <div class="eig a">8</div>
            <div class="nin a">9</div>
            <div class="mul b">×</div>
            <div class="fo a">4</div>
            <div class="fiv a">5</div>
            <div class="six a">6</div>
            <div class="sub b">−</div>
            <div class="one a">1</div>
            <div class="two a">2</div>
            <div class="th a">3</div>
            <div class="plus b">+</div>
            <div class="both">±</div>
            <div class="ze a">0</div>
            <div class="dec">.</div>
            <div class="eq b">=</div>
        </div>
    </div>
</body>

</html>
